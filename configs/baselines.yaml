# Phase 1 baselines.

baselines:
  tfidf_lr:
    ngram_range: [1, 2]
    max_features: 50000
    C: 1.0
    class_weight: balanced
    strip_mentions: false
    # char_wb 2-5 grams boost macro-F1 (~0.812) and catch obfuscation;
    # the paper's word-only baseline is char_features: false.
    char_features: true

  encoders:
    models:
      - bert-base-multilingual-cased   # mBERT
      - xlm-roberta-base               # XLM-R
      - google/muril-base-cased        # MuRIL
    learning_rate: 2.0e-05
    batch_size: 16
    epochs: 3
    max_length: 256
    # CPU smoke config: tiny model + small subset, validates the whole
    # Trainer path in seconds without loading the full-size encoders.
    smoke:
      enabled: false
      model_name: google/bert_uncased_L-2_H-128_A-2   # tiny (4MB); bert-tiny lacks tokenizer.json for transformers 5
      n_train: 200
      n_eval: 100
      epochs: 1
      batch_size: 16

datasets:
  # Which processed datasets feed Phase 1 training; fill in as loaders land.
  train: [hatexplain]
  eval: [hatexplain]

# Early bias signal for baselines: membership = these terms appear in
# target_group (must match target_group values in the unified schema).
bias_audit:
  terms: [african, islam, jewish, homosexual, women, refugee, arab]
