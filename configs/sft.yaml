# Phase 2: LoRA SFT of a small instruction-tuned LLM.

sft:
  # DECISION NEEDED: pick one 1-3B instruction model (licence + access).
  # Candidates: Qwen/Qwen2.5-1.5B-Instruct, meta-llama/Llama-3.2-1B-Instruct
  # (gated), google/gemma-2-2b-it (gated).
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  max_length: 512
  learning_rate: 2.0e-04
  batch_size: 4
  gradient_accumulation: 4
  epochs: 2

  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]

  # CPU smoke config: tiny GPT-2 validates the peft/trl SFT path in seconds.
  smoke:
    enabled: false
    model_name: sshleifer/tiny-gpt2
    n_train: 64
    epochs: 1
    batch_size: 8
    max_length: 192
    lora_r: 8
    lora_alpha: 16
    target_modules: [c_attn]

output_dir: checkpoints/sft
